# doubao2api Docker Compose（Linux 部署）
#
# 用法:
#   docker compose up -d --build
#
# 说明:
#   - ./profile 为登录态目录（自动创建），重启容器登录态不丢
#   - DOUBAO_API_KEY 为 API 鉴权密钥，务必改成你自己的随机字符串！
#   - 首次部署后需要扫码登录，见 DEPLOY_LINUX.md 第 4 步

services:
  doubao2api:
    build:
      context: .
      dockerfile: Dockerfile.linux
      # 镜像源可从 .env 覆盖（国内默认阿里云/清华/npmmirror；海外可改官方源）
      args:
        APT_MIRROR: "${APT_MIRROR:-mirrors.aliyun.com}"
        PIP_MIRROR: "${PIP_MIRROR:-https://pypi.tuna.tsinghua.edu.cn/simple}"
        PLAYWRIGHT_HOST: "${PLAYWRIGHT_HOST:-https://cdn.npmmirror.com/binaries/playwright}"
    container_name: doubao2api
    restart: unless-stopped
    ports:
      # 宿主机端口从 .env 读取（默认 9090）
      - "${DOUBAO_PORT:-9090}:${DOUBAO_PORT:-9090}"
    volumes:
      # 登录态持久化（重要：容器重建后不丢失）
      - ./profile:/app/profile
    environment:
      DOUBAO_HOST: "0.0.0.0"
      DOUBAO_PORT: "${DOUBAO_PORT:-9090}"
      DOUBAO_HEADLESS: "false"
      DOUBAO_BROWSER_DATA: "/app/profile"
      # ↓↓↓ 从 .env 读取（未设时用默认 change-me），生成密钥: openssl rand -hex 32
      DOUBAO_API_KEY: "${DOUBAO_API_KEY:-change-me}"
