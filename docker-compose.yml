# doubao2api Docker Compose（Linux 部署）
#
# 用法:
#   docker compose up -d --build
#
# 说明:
#   - ./profile 为登录态目录（自动创建），重启容器登录态不丢
#   - DOUBAO_API_KEY 为 API 鉴权密钥，务必改成你自己的随机字符串！
#   - 首次部署后需要扫码登录，见 DEPLOY_LINUX.md 第 4 步

services:
  doubao2api:
    build:
      context: .
      dockerfile: Dockerfile.linux
      # 镜像源可从 .env 覆盖（国内默认阿里云/清华/npmmirror；海外可改官方源）
      args:
        APT_MIRROR: "${APT_MIRROR:-mirrors.aliyun.com}"
        PIP_MIRROR: "${PIP_MIRROR:-https://pypi.tuna.tsinghua.edu.cn/simple}"
        PLAYWRIGHT_HOST: "${PLAYWRIGHT_HOST:-https://cdn.npmmirror.com/binaries/playwright}"
    container_name: doubao2api
    restart: unless-stopped
    # 用 tini 作为 PID 1 转发信号，保证 docker stop 时能优雅关闭 Chromium
    init: true
    ports:
      # 宿主机端口从 .env 读取（默认 9090）
      - "${DOUBAO_PORT:-9090}:${DOUBAO_PORT:-9090}"
    volumes:
      # 登录态持久化（重要：容器重建后不丢失）
      - ./profile:/app/profile
      # 千问上游登录态（仅 QIANWEN_ENABLED=true 时使用）
      - ./qianwen_profile:/app/qianwen_profile
    environment:
      DOUBAO_HOST: "0.0.0.0"
      DOUBAO_PORT: "${DOUBAO_PORT:-9090}"
      DOUBAO_HEADLESS: "false"
      DOUBAO_BROWSER_DATA: "/app/profile"
      DOUBAO_RPM_LIMIT: "${DOUBAO_RPM_LIMIT:-20}"
      # ↓↓↓ 必填：务必在 .env 中设置随机密钥，生成方式: openssl rand -hex 32
      # 未设置时 compose 会直接报错退出（避免以无鉴权方式暴露到公网）
      DOUBAO_API_KEY: "${DOUBAO_API_KEY:?please set DOUBAO_API_KEY in .env (openssl rand -hex 32)}"
      # noVNC（可选）：容器本身不跑 noVNC，需在宿主机另起 x11vnc/noVNC 时再填
      DOUBAO_NOVNC_URL: "${DOUBAO_NOVNC_URL:-}"
      DOUBAO_NOVNC_PASSWORD: "${DOUBAO_NOVNC_PASSWORD:-}"
      # 安全相关（默认收紧）
      DOUBAO_CORS_ORIGINS: "${DOUBAO_CORS_ORIGINS:-}"
      DOUBAO_ENABLE_ADMIN_DEBUG: "${DOUBAO_ENABLE_ADMIN_DEBUG:-false}"
      DOUBAO_ALLOW_PRIVATE_FILE_URLS: "${DOUBAO_ALLOW_PRIVATE_FILE_URLS:-false}"
      DOUBAO_FILE_URL_MAX_MB: "${DOUBAO_FILE_URL_MAX_MB:-50}"
      # 千问上游（可选）
      QIANWEN_ENABLED: "${QIANWEN_ENABLED:-false}"
      QIANWEN_HEADLESS: "${QIANWEN_HEADLESS:-true}"
      QIANWEN_BROWSER_DATA: "${QIANWEN_BROWSER_DATA:-/app/qianwen_profile}"
      QIANWEN_OBFUSCATE_TOOLS: "${QIANWEN_OBFUSCATE_TOOLS:-false}"
